# Documentation site, built with Zensical (https://zensical.org). Preview locally:
#   pip install -r requirements-docs.txt && zensical serve

[project]
site_name = "Laya-Pro"
site_description = "Typed decisions in one forward pass, with a memory for them"
site_url = "https://tgundhus.github.io/laya/"
repo_url = "https://github.com/tgundhus/laya"
repo_name = "tgundhus/laya"
edit_uri = "edit/main/docs/"
copyright = "Apache 2.0. Laya by Convai Innovations; Laya-Pro by Tobias Gundhus."
# The navigation order lives in docs/.nav.yml, read by the awesome-nav plugin below. A page it
# does not list still appears, so a new page needs no edit here. A folder with an index.md
# becomes a section that opens on that page.

[project.theme]
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.awesome-nav]

# API reference pages under docs/reference/ are generated from the docstrings in laya/.
[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_options = { returns_multiple_items = false }
docstring_section_style = "list"
filters = ["!^_"]
members_order = "source"
merge_init_into_class = true
line_length = 70
separate_signature = true
show_root_full_path = false
show_root_heading = true
show_signature_annotations = true
show_source = false
