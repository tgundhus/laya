# Advisories the dependency audit (.github/workflows/security.yml) accepts, read by
# scripts/pip_audit_policy.py. Each was reviewed and has no fixed release: every version up to the
# latest is affected. None can be reached through Laya-Pro, and only an optional integration pulls
# these packages in, never the core package, the Docker image or the Nix build. The audit fails
# again for an entry as soon as a fixed release exists, so each is looked at again then.

[[advisory]]
id = "PYSEC-2026-311"
aliases = ["CVE-2026-45829", "GHSA-f4j7-r4q5-qw2c"]
package = "chromadb"
via = "laya[crewai]: crewai pins chromadb~=1.1.0"
reason = "Unauthenticated code injection in ChromaDB's HTTP server, through its collections endpoint with trust_remote_code. Nothing in Laya-Pro or its CrewAI integration starts that server."
reviewed = "2026-09-29"

